<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentBohol - Clearing Session</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 48px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        p { color: rgba(255,255,255,0.65); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 13px; color: rgba(255,255,255,0.5); }
        .success { color: #34d399; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,0.4); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔄</div>
        <h1>Refreshing Your Session</h1>
        <p>We're clearing outdated session data to ensure a smooth experience. This only takes a moment.</p>
        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Clearing cookies...</p>
        <a href="/" class="btn hidden" id="continueBtn">Continue to RentBohol</a>
    </div>

    <script>
        (function() {
            var cleared = 0;

            // Clear all cookies for this domain
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (!cookie) continue;
                var name = cookie.split('=')[0];
                // Clear for all possible path combinations
                var paths = ['/', '/api', ''];
                for (var j = 0; j < paths.length; j++) {
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j];
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j] + '; domain=' + window.location.hostname;
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j] + '; domain=.' + window.location.hostname;
                    // Also clear with secure flag
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j] + '; secure';
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j] + '; domain=' + window.location.hostname + '; secure';
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + paths[j] + '; domain=.' + window.location.hostname + '; secure';
                }
                cleared++;
            }

            // Update UI after a brief pause
            setTimeout(function() {
                var remaining = document.cookie.split(';').filter(function(c) { return c.trim(); }).length;
                var statusEl = document.getElementById('status');
                var spinnerEl = document.getElementById('spinner');
                var btnEl = document.getElementById('continueBtn');

                spinnerEl.style.display = 'none';
                statusEl.className = 'status success';
                statusEl.textContent = 'Done! Cleared ' + cleared + ' cookie(s). ' +
                    (remaining > 0 ? remaining + ' httpOnly cookie(s) will be cleared on next request.' : 'All clean!');
                btnEl.className = 'btn';
            }, 1200);
        })();
    </script>
</body>
</html>
